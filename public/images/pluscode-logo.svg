<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 180" width="100%" height="100%">
  <defs>
    <style>
      .plus-text { font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Montserrat, 'Helvetica Neue', sans-serif; font-weight: 800; font-size: 58px; fill: #111111; letter-spacing: 2px; }
      .code-text { font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Montserrat, 'Helvetica Neue', sans-serif; font-weight: 800; font-size: 58px; fill: #FF6600; letter-spacing: 2px; }
      .tagline { font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Montserrat, 'Helvetica Neue', sans-serif; font-weight: 700; font-size: 15px; fill: #111111; letter-spacing: 3.5px; }
      .tagline-sep { fill: #FF6600; font-weight: 900; }
    </style>
  </defs>

  <!-- Left Icon Group -->
  <g transform="translate(10, 10)">
    <!-- Dispersing pixel blocks (Orange) -->
    <rect x="32" y="42" width="6.5" height="6.5" fill="#FF6600" />
    <rect x="42" y="36" width="7" height="7" fill="#FF6600" />
    <rect x="52" y="32" width="7" height="7" fill="#FF6600" />
    <rect x="36" y="52" width="6.5" height="6.5" fill="#FF6600" />
    <rect x="45" y="47" width="7" height="7" fill="#FF6600" />
    <rect x="55" y="42" width="8" height="8" fill="#FF6600" />
    <rect x="66" y="37" width="8" height="8" fill="#FF6600" />
    <rect x="48" y="58" width="7" height="7" fill="#FF6600" />
    <rect x="58" y="53" width="8" height="8" fill="#FF6600" />

    <!-- Orange Plus Sign -->
    <path d="M 58 72 L 58 87 L 43 87 L 43 99 L 58 99 L 58 114 L 70 114 L 70 99 L 85 99 L 85 87 L 70 87 L 70 72 Z" fill="#FF6600" />

    <!-- Dark Enclosing Loop Shape (Black/Dark) -->
    <path d="M 70 38 L 105 38 C 128 38 144 54 144 76 C 144 98 128 114 105 114 L 85 114 L 85 101 L 105 101 C 120 101 131 90 131 76 C 131 62 120 51 105 51 L 70 51 Z" fill="#111111" />

    <!-- Code Symbol inside '</>' (White / Inverted) -->
    <text x="107" y="82" text-anchor="middle" font-family="monospace" font-size="20" font-weight="900" fill="#111111" letter-spacing="-1">&lt;/&gt;</text>

    <!-- Bottom Left Dark Swoosh -->
    <path d="M 16 112 C 22 135 60 148 100 148 C 65 146 28 134 26 118 C 25 115 22 113 16 112 Z" fill="#111111" />

    <!-- Bottom Right Orange Swoosh -->
    <path d="M 85 148 C 125 148 155 132 165 106 C 160 122 135 142 95 146 Z" fill="#FF6600" />
  </g>

  <!-- Right Text Group -->
  <!-- Brand Name -->
  <text x="185" y="98">
    <tspan class="plus-text">PLUS</tspan>
    <tspan dx="12" class="code-text">CODE</tspan>
  </text>

  <!-- Subtitle / Tagline -->
  <text x="187" y="128" class="tagline">
    WE DESIGN <tspan class="tagline-sep">|</tspan> WE DEVELOP <tspan class="tagline-sep">|</tspan> WE DELIVER
  </text>
</svg>
